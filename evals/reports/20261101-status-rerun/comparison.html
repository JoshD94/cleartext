<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;font-family:var(--font-sans);color:var(--foreground)}*{box-sizing:border-box}.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}button,select{font:inherit;color:var(--foreground);background:var(--secondary);border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px}button[aria-pressed=true]{background:var(--primary);color:var(--primary-foreground)}select{margin-left:auto;max-width:100%}p{font-size:13px;color:var(--muted-foreground);line-height:1.5;margin:8px 0 14px}.axis{display:flex;justify-content:space-between;font:11px var(--font-mono);color:var(--muted-foreground);margin-bottom:10px}.row{margin:0 0 13px}.label{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-bottom:5px}.value{font:600 13px var(--font-mono);white-space:nowrap}.track{height:24px;background:var(--secondary);border-radius:4px;overflow:hidden}.bar{height:24px;background:var(--chart-1);border-radius:4px}.before{background:var(--chart-2)}.edits{font-size:11px;color:var(--muted-foreground);margin-top:3px}.legend{display:flex;gap:16px;font-size:12px;color:var(--muted-foreground);margin-top:12px}.key{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--chart-1);margin-right:5px}.key.old{background:var(--chart-2)}.note{border-top:1px solid var(--border);padding-top:10px;margin-top:15px}#meaning{font-weight:500;color:var(--foreground)}@media(max-width:440px){select{margin-left:0;width:100%}.label{font-size:12px}}
</style></head><body><div class="controls"><button data-panel="six" aria-pressed="true">Status report · 6</button><button data-panel="large" aria-pressed="false">Development panel · 190</button><select id="metric" aria-label="Metric"><option value="grade">Reading grade · lower is easier</option><option value="nli">Backward entailment · higher</option></select></div><p id="scope"></p><div class="axis" id="axis"></div><div id="rows" aria-live="polite"></div><div class="legend"><span><i class="key old"></i>Earlier result / input</span><span><i class="key"></i>November 1 rerun</span></div><p class="note" id="meaning"></p><p>Entailment is an automatic meaning-preservation signal, not accuracy. Copies can score highly. Check changed counts alongside the means. These panels have been inspected before and are not independent tests.</p><script>
const data={"six": {"note": "Same six authored passages as the submitted status report. All means use six inputs.", "rows": [{"label": "Original input", "grade": 20.713911822038757, "nli": 0.9901454846064249, "changed": 0, "n": 6, "before": true}, {"label": "Dictionary baseline", "grade": 16.57351421855292, "nli": 0.9933779935042063, "changed": 6, "n": 6, "before": true}, {"label": "Oct 21 \u00b7 v7 words", "grade": 19.695483602797847, "nli": 0.6909851565336188, "changed": 6, "n": 6, "before": true}, {"label": "Nov 1 \u00b7 v7 words", "grade": 19.695483602797847, "nli": 0.6909851565336188, "changed": 6, "n": 6, "before": false}, {"label": "Nov 1 \u00b7 v7 + phrase/structure rules", "grade": 20.169448744410047, "nli": 0.7263585537051162, "changed": 6, "n": 6, "before": false}, {"label": "Nov 1 \u00b7 v7 + phrases + T5", "grade": 19.686212876963655, "nli": 0.7265815148130059, "changed": 6, "n": 6, "before": false}, {"label": "Nov 1 \u00b7 contextual + phrases + T5", "grade": 20.133600791193672, "nli": 0.9865768353144327, "changed": 6, "n": 6, "before": false}]}, "large": {"note": "Same 190 reused development inputs as October 27. Before/after use the same saved checkpoints.", "rows": [{"label": "Original input", "grade": 11.708010730299112, "nli": 0.9896441572590878, "changed": 0, "n": 190, "before": true}, {"label": "Dictionary baseline", "grade": 11.52345831919675, "nli": 0.9898780537279028, "changed": 13, "n": 190, "before": true}, {"label": "Oct 27 \u00b7 v7 words", "grade": 11.317897007666845, "nli": 0.9026986243142011, "changed": 140, "n": 190, "before": true}, {"label": "Nov 1 \u00b7 v7 words", "grade": 11.305993498894914, "nli": 0.9027878703696556, "changed": 140, "n": 190, "before": false}, {"label": "Oct 27 \u00b7 v7 + phrases + T5", "grade": 10.773326813466646, "nli": 0.9049589085184332, "changed": 141, "n": 190, "before": true}, {"label": "Nov 1 \u00b7 v7 + phrases + T5", "grade": 10.761423304694716, "nli": 0.9050500610598216, "changed": 141, "n": 190, "before": false}, {"label": "Oct 27 \u00b7 contextual + phrases + T5", "grade": 10.866899449253092, "nli": 0.9508486341452226, "changed": 137, "n": 190, "before": true}, {"label": "Nov 1 \u00b7 contextual + phrases + T5", "grade": 10.857583659779406, "nli": 0.9508167339635915, "changed": 138, "n": 190, "before": false}]}};let panel='six';const metric=document.getElementById('metric');function render(){const d=data[panel],m=metric.value,max=m==='grade'?24:1;document.getElementById('scope').textContent=d.note;document.getElementById('axis').innerHTML=[0,.25,.5,.75,1].map(v=>`<span>${m==='grade'?(v*max).toFixed(0):v.toFixed(2)}</span>`).join('');document.getElementById('rows').innerHTML=d.rows.map(r=>`<div class="row"><div class="label"><span>${r.label}</span><span class="value">${r[m].toFixed(m==='grade'?3:4)}</span></div><div class="track" role="img" aria-label="${r.label}: ${r[m]}"><div class="bar ${r.before?'before':''}" style="width:${Math.min(100,r[m]/max*100)}%"></div></div><div class="edits">${r.changed} / ${r.n} inputs changed</div></div>`).join('');document.getElementById('meaning').textContent=m==='grade'?'Lower reading grade suggests easier wording and sentence length; it does not establish grammatical or semantic quality.':'Backward entailment asks whether the simplified output still supports the original claim. Read alongside forward entailment, grammar and edit coverage.';}document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{panel=b.dataset.panel;document.querySelectorAll('[data-panel]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()});metric.onchange=render;render();
</script></body></html>
